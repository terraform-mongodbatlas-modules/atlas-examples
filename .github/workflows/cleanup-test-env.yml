name: Cleanup test env

# Deletes stale Atlas projects left behind by E2E runs (e.g. when a runner is
# killed before the e2e/scripts/<cloud>.sh trap cleanup runs). Uses the
# clean-atlas-org tooling from mongodb/terraform-provider-mongodbatlas (checked
# out at a pinned ref below, bump periodically): it removes stale bot projects
# including their contents (clusters, private endpoints) after a 5h grace
# period, so in-flight runs are not affected, and leftovers are retried on the
# next run. The atlas-examples-e2e- prefix is part of its built-in default
# prefixes (mongodb/terraform-provider-mongodbatlas#4616).
#
# Runs after the E2E workflow's jobs (see e2e.yml) and can be run manually;
# both delete for real (the 5h grace period protects anything recent).
#
# Required GitHub secrets:
#   MONGODB_ATLAS_CLIENT_ID, MONGODB_ATLAS_CLIENT_SECRET (service account with
#   ORG_OWNER), MONGODB_ATLAS_ORG_ID
#   (optional) MONGODB_ATLAS_BASE_URL for non-production Atlas environments

on:
  workflow_call: # runs from the E2E workflow after its jobs complete
    secrets:
      MONGODB_ATLAS_CLIENT_ID:
        required: true
      MONGODB_ATLAS_CLIENT_SECRET:
        required: true
      MONGODB_ATLAS_ORG_ID:
        required: true
      MONGODB_ATLAS_BASE_URL:
        required: false
  workflow_dispatch: {} # workflow can be run manually

permissions:
  contents: read

jobs:
  cleanup-test-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cleanup-test-env
      cancel-in-progress: false
    steps:
      - name: Checkout terraform-provider-mongodbatlas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mongodb/terraform-provider-mongodbatlas
          ref: f97f332befc6c4ea59599be5ddcbbfa0ab655068 # master incl. #4616, bump periodically
      - name: Clean Atlas org
        uses: ./.github/templates/clean-atlas-org
        env:
          MONGODB_ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
          MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}
          MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
          MONGODB_ATLAS_BASE_URL: ${{ secrets.MONGODB_ATLAS_BASE_URL }}
          # Deleting clusters is slow; leftovers are retried on the next run instead of blocking
          MONGODB_ATLAS_CLEAN_RETRY_ATTEMPTS: "1"
