name: Format and validate

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: Validate Examples
        run: |
          for dir in $(find . -type f -name "main.tf" -exec dirname {} \;); do
            echo "Validating $dir..."
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done
      - name: Test Examples
        run: |
          for tests_dir in $(find . -type f -name "*.tftest.hcl" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u); do
            dir=$(dirname "$tests_dir")
            echo "Testing $dir..."
            (cd "$dir" && terraform init -backend=false -input=false && terraform test)
          done
