name: E2E apply and destroy

# End-to-end verification of the examples against real Atlas + cloud infrastructure.
# Each job runs e2e/scripts/<cloud>.sh, which bootstraps the prerequisite networking
# (e2e/network-bootstrap/<cloud>, see its README), applies the example from its
# original location with enable_validation_vm = false, smoke-checks outputs, then
# destroys everything (cleanup runs even on failure). The same scripts can be run
# locally with the equivalent credentials in the environment.
#
# Required GitHub secrets:
#   Atlas: MONGODB_ATLAS_CLIENT_ID, MONGODB_ATLAS_CLIENT_SECRET (service account
#          with ORG_OWNER), MONGODB_ATLAS_ORG_ID
#          (optional) MONGODB_ATLAS_BASE_URL for non-production Atlas environments
#   AWS:   AWS_ROLE_ARN (IAM role assumed via GitHub OIDC, no long-lived keys)
#   Azure: ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID
#          (optional) ATLAS_AZURE_APP_ID for non-production Atlas environments
#          (defaults to the production Atlas Azure app when unset). If the Atlas
#          app's service principal already exists in the tenant it is reused
#          (BYO mode) instead of being created/destroyed per run.
#   GCP:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL, GCP_PROJECT_ID

on:
  push: # TEMPORARY: verification on branch pushes, removed before merge
  workflow_dispatch:
    inputs:
      cloud:
        description: Which example to run
        type: choice
        default: all
        options:
          - all
          - aws
          - azure
          - gcp
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

jobs:
  aws:
    name: E2E AWS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'aws'
    concurrency:
      group: e2e-aws
      cancel-in-progress: false
    env:
      MONGODB_ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
      MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Configure optional Atlas base URL
        run: |
          if [ -n "${{ secrets.MONGODB_ATLAS_BASE_URL }}" ]; then
            echo "MONGODB_ATLAS_BASE_URL=${{ secrets.MONGODB_ATLAS_BASE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Run E2E
        env:
          RUN_ID: ${{ github.run_id }}
        run: e2e/scripts/aws.sh

  azure:
    name: E2E Azure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'azure'
    concurrency:
      group: e2e-azure
      cancel-in-progress: false
    env:
      MONGODB_ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
      MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Configure optional Atlas base URL
        run: |
          if [ -n "${{ secrets.MONGODB_ATLAS_BASE_URL }}" ]; then
            echo "MONGODB_ATLAS_BASE_URL=${{ secrets.MONGODB_ATLAS_BASE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Run E2E
        env:
          RUN_ID: ${{ github.run_id }}
          ATLAS_AZURE_APP_ID: ${{ secrets.ATLAS_AZURE_APP_ID }} # may be empty; script falls back to the production Atlas app
        run: e2e/scripts/azure.sh

  gcp:
    name: E2E GCP
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'gcp'
    concurrency:
      group: e2e-gcp
      cancel-in-progress: false
    env:
      MONGODB_ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
      MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}
      MONGODB_ATLAS_ORG_ID: ${{ secrets.MONGODB_ATLAS_ORG_ID }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Configure optional Atlas base URL
        run: |
          if [ -n "${{ secrets.MONGODB_ATLAS_BASE_URL }}" ]; then
            echo "MONGODB_ATLAS_BASE_URL=${{ secrets.MONGODB_ATLAS_BASE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Run E2E
        env:
          RUN_ID: ${{ github.run_id }}
        run: e2e/scripts/gcp.sh

  # Sweeps stale atlas-examples-e2e-* Atlas projects after every E2E run —
  # catches leftovers from killed runners (the 24h grace period protects
  # in-flight runs, so anything from this run is swept on a later one).
  cleanup:
    name: Cleanup test env
    needs: [aws, azure, gcp]
    if: always()
    uses: ./.github/workflows/cleanup-test-env.yml
    secrets: inherit
