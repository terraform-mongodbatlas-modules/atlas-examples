name: E2E apply and destroy

# End-to-end verification of the examples against real Atlas + cloud infrastructure.
# Each job bootstraps the prerequisite networking (e2e/network-bootstrap/<cloud>,
# see its README), applies the example from its original location with
# enable_validation_vm = false, smoke-checks outputs, then destroys everything
# (destroy steps run even on failure).
#
# Required GitHub secrets:
#   Atlas: MONGODB_ATLAS_CLIENT_ID, MONGODB_ATLAS_CLIENT_SECRET (service account
#          with ORG_OWNER), MONGODB_ATLAS_ORG_ID
#          (optional) MONGODB_ATLAS_BASE_URL for non-production Atlas environments
#   AWS:   AWS_ROLE_ARN (IAM role assumed via GitHub OIDC, no long-lived keys)
#   Azure: ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID
#          (optional) ATLAS_AZURE_APP_ID for non-production Atlas environments
#          (defaults to the production Atlas Azure app when unset). If the Atlas
#          app's service principal already exists in the tenant it is reused
#          (BYO mode) instead of being created/destroyed per run.
#   GCP:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL, GCP_PROJECT_ID

on:
  # TEMPORARY (testing before merge): run E2E on pushes to this branch. Remove before merging.
  push:
    branches:
      - CLOUDP-428615
  workflow_dispatch:
    inputs:
      cloud:
        description: Which example to run
        type: choice
        default: all
        options:
          - all
          - aws
          - azure
          - gcp
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read
  id-token: write # required for GCP Workload Identity Federation

env:
  MONGODB_ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
  MONGODB_ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}
  TF_VAR_atlas_org_id: ${{ secrets.MONGODB_ATLAS_ORG_ID }}

jobs:
  aws:
    name: E2E AWS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # TEMPORARY: 'push' allowed for pre-merge testing, remove with the push trigger
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'aws'
    concurrency:
      group: e2e-aws
      cancel-in-progress: false
    env:
      TF_VAR_atlas_project_name: ci-aws-${{ github.run_id }}
      TF_VAR_atlas_cluster_name: ci-aws-${{ github.run_id }}
      # Single region (AWS format) for the bootstrap VPC, provider, and Atlas
      # cluster placement (normalized to Atlas format in the map step below).
      # Switch here if the account's VPC quota or Atlas capacity is exhausted.
      TF_VAR_aws_region: us-east-2
      TF_VAR_enable_validation_vm: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Configure optional Atlas base URL
        run: |
          if [ -n "${{ secrets.MONGODB_ATLAS_BASE_URL }}" ]; then
            echo "MONGODB_ATLAS_BASE_URL=${{ secrets.MONGODB_ATLAS_BASE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Apply networking
        working-directory: e2e/network-bootstrap/aws
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var="name_suffix=${{ github.run_id }}"
      - name: Map networking outputs to example variables
        working-directory: e2e/network-bootstrap/aws
        run: |
          vpc_id=$(terraform output -raw vpc_id)
          subnet_ids=$(terraform output -json private_subnet_ids | jq -c .)
          atlas_region=$(echo "$TF_VAR_aws_region" | tr 'a-z' 'A-Z' | tr '-' '_')
          regions=$(jq -nc --arg vpc "$vpc_id" --argjson subs "$subnet_ids" --arg name "$atlas_region" \
            '[{name: $name, vpc_id: $vpc, subnet_ids: $subs}]')
          echo "TF_VAR_regions=$regions" >> "$GITHUB_ENV"
      - name: Apply example
        working-directory: aws/atlas-aws-module-complete
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: Smoke check outputs
        working-directory: aws/atlas-aws-module-complete
        run: |
          cluster_id=$(terraform output -raw cluster_id)
          test -n "$cluster_id"
          echo "Cluster deployed: $cluster_id"
      - name: Destroy example
        if: always()
        working-directory: aws/atlas-aws-module-complete
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
      - name: Destroy networking
        if: always()
        working-directory: e2e/network-bootstrap/aws
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false -var="name_suffix=${{ github.run_id }}"

  azure:
    name: E2E Azure
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # TEMPORARY: 'push' allowed for pre-merge testing, remove with the push trigger
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'azure'
    concurrency:
      group: e2e-azure
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_atlas_project_name: ci-azure-${{ github.run_id }}
      TF_VAR_atlas_cluster_name: ci-azure-${{ github.run_id }}
      TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_VAR_enable_validation_vm: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Configure optional Atlas base URL
        run: |
          if [ -n "${{ secrets.MONGODB_ATLAS_BASE_URL }}" ]; then
            echo "MONGODB_ATLAS_BASE_URL=${{ secrets.MONGODB_ATLAS_BASE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Configure optional Atlas Azure app ID
        run: |
          if [ -n "${{ secrets.ATLAS_AZURE_APP_ID }}" ]; then
            echo "TF_VAR_atlas_azure_app_id=${{ secrets.ATLAS_AZURE_APP_ID }}" >> "$GITHUB_ENV"
          fi
      # If the Atlas Azure app's service principal already exists in the tenant
      # (shared tenants), reuse it (BYO mode) so terraform never creates/deletes it.
      - name: Detect existing Atlas Azure service principal
        run: |
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" --only-show-errors --output none
          app_id="${{ secrets.ATLAS_AZURE_APP_ID }}"
          app_id="${app_id:-9f2deb0d-be22-4524-a403-df531868bac0}" # production Atlas app fallback
          if sp_id=$(az ad sp show --id "$app_id" --query id -o tsv --only-show-errors 2>/dev/null); then
            echo "Existing service principal found for app $app_id ($sp_id) — using BYO mode"
            echo "TF_VAR_atlas_azure_service_principal_id=$sp_id" >> "$GITHUB_ENV"
          else
            echo "No existing service principal for app $app_id — module will create one"
          fi
      - name: Apply networking
        working-directory: e2e/network-bootstrap/azure
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var="name_suffix=${{ github.run_id }}"
      - name: Map networking outputs to example variables
        working-directory: e2e/network-bootstrap/azure
        run: |
          resource_group_name=$(terraform output -raw resource_group_name)
          subnet_id=$(terraform output -raw subnet_id)
          azure_location=$(terraform output -raw azure_location)
          regions=$(jq -nc --arg subnet "$subnet_id" --arg loc "$azure_location" \
            '[{name: "US_EAST_2", azure_location: $loc, subnet_id: $subnet}]')
          {
            echo "TF_VAR_azure_resource_group_name=$resource_group_name"
            echo "TF_VAR_regions=$regions"
          } >> "$GITHUB_ENV"
      - name: Apply example
        working-directory: azure/atlas-azure-module-complete
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: Smoke check outputs
        working-directory: azure/atlas-azure-module-complete
        run: |
          cluster_id=$(terraform output -raw cluster_id)
          test -n "$cluster_id"
          echo "Cluster deployed: $cluster_id"
      - name: Destroy example
        if: always()
        working-directory: azure/atlas-azure-module-complete
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
      - name: Destroy networking
        if: always()
        working-directory: e2e/network-bootstrap/azure
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false -var="name_suffix=${{ github.run_id }}"

  gcp:
    name: E2E GCP
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # TEMPORARY: 'push' allowed for pre-merge testing, remove with the push trigger
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'gcp'
    concurrency:
      group: e2e-gcp
      cancel-in-progress: false
    env:
      TF_VAR_atlas_project_name: ci-gcp-${{ github.run_id }}
      TF_VAR_atlas_cluster_name: ci-gcp-${{ github.run_id }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      # Single region (GCP format) for both the bootstrap subnetwork and Atlas
      # cluster placement — the example normalizes it internally. Switch here if
      # Atlas reports "No Capacity" for private endpoints in this region.
      GCP_E2E_REGION: us-central1
      TF_VAR_gcp_region: us-central1 # consumed by e2e/network-bootstrap/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      - name: Configure optional Atlas base URL
        run: |
          if [ -n "${{ secrets.MONGODB_ATLAS_BASE_URL }}" ]; then
            echo "MONGODB_ATLAS_BASE_URL=${{ secrets.MONGODB_ATLAS_BASE_URL }}" >> "$GITHUB_ENV"
          fi
      - name: Apply networking
        working-directory: e2e/network-bootstrap/gcp
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var="name_suffix=${{ github.run_id }}"
      - name: Map networking outputs to example variables
        working-directory: e2e/network-bootstrap/gcp
        run: |
          subnetwork=$(terraform output -raw subnetwork_self_link)
          regions=$(jq -nc --arg subnet "$subnetwork" --arg region "$GCP_E2E_REGION" \
            '[{name: $region, subnetwork: $subnet}]')
          echo "TF_VAR_regions=$regions" >> "$GITHUB_ENV"
      - name: Apply example
        working-directory: gcp/atlas-gcp-module-complete
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: Smoke check outputs
        working-directory: gcp/atlas-gcp-module-complete
        run: |
          cluster_id=$(terraform output -raw cluster_id)
          test -n "$cluster_id"
          echo "Cluster deployed: $cluster_id"
      - name: Destroy example
        if: always()
        working-directory: gcp/atlas-gcp-module-complete
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
      - name: Destroy networking
        if: always()
        working-directory: e2e/network-bootstrap/gcp
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false -var="name_suffix=${{ github.run_id }}"
