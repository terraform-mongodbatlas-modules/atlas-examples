[project]
name = "hybrid-search"
version = "0.1.0"
description = "Lean hybrid search demo: Voyage ingest and Atlas $rankFusion"
requires-python = ">=3.13"
dependencies = [
    "certifi",
    "motor",
    "pydantic-ai-slim[anthropic,google,openai,retries]",
    "pydantic-settings",
    "pymongo",
    "typer",
    "voyageai",
]

[project.scripts]
hybrid-search = "hybrid_search.cli.app:main"

[project.optional-dependencies]
aws = ["pymongo[aws]"]
ui = ["chainlit", "pymupdf"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_search"]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.sdist]
exclude = ["**/*_test.py"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
