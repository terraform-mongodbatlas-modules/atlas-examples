[project]
name = "hybrid-search"
version = "0.1.0"
description = "Lean hybrid search demo: Atlas autoEmbed ingest and Atlas $rankFusion"
requires-python = ">=3.13"
dependencies = [
    "certifi",
    "motor",
    "pydantic-ai-slim[anthropic,bedrock,google,openai,retries]",
    "pydantic-settings",
    "pymongo",
    "typer",
]

[project.scripts]
hybrid-search = "hybrid_search.cli.app:main"

[project.optional-dependencies]
aws = ["pymongo[aws]"]
ui = ["chainlit", "pymupdf", "pyyaml", "uvicorn"]

[dependency-groups]
dev = ["atlas-local-lib-py", "pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_search"]
exclude = ["**/*_test.py"]

[tool.hatch.build.targets.sdist]
exclude = ["**/*_test.py"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
asyncio_mode = "auto"
# cli/query_logic_test.py and ui/query_logic_test.py share a basename; without this,
# pytest's default import mode collides on the module name.
consider_namespace_packages = true

[tool.ruff]
line-length = 100
target-version = "py313"
